# Test and package FotoFixer on Linux, Windows, and macOS.
#
# - Every push to any branch: run the tests and build all three apps (the
#   Windows one as an installer). Download the builds from the workflow run's
#   "Artifacts" section; each download is the release file itself (no extra
#   zip around it).
# - Pushing a tag like v1.2.0: also attach the builds to that GitHub release
#   (a draft release is created if one does not exist yet).
# - "Run workflow" on the Actions tab runs it manually.
# - The web version has its own workflow, web.yml.

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Pushes that only touch the web version run web.yml instead, and
    # docs-only pushes build nothing. (Path filters don't apply to tags, so
    # a release still builds everything.)
    paths-ignore:
      - "web/**"
      - "docker/**"
      - "docs/**"
      - "**.md"
      # The web version's own scripts and their test (web.yml runs that test).
      - "packaging/fetch_web_vendor.py"
      - "packaging/serve_web.py"
      - "tests/test_fetch_web_vendor.py"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let the other platforms finish even if one fails.
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    env:
      # Lets the Qt GUI tests run without a screen.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt PyInstaller

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 \
            libxkbcommon0 libfontconfig1 libdbus-1-3

      # The same pinned ExifTool as Windows and macOS, run by the system Perl.
      - name: Download ExifTool (Linux)
        if: runner.os == 'Linux'
        run: |
          python packaging/fetch_exiftool.py linux
          ./tools/linux/exiftool -ver

      - name: Download ExifTool (Windows)
        if: runner.os == 'Windows'
        run: |
          python packaging/fetch_exiftool.py windows
          ./tools/windows/exiftool.exe -ver

      - name: Download ExifTool (macOS)
        if: runner.os == 'macOS'
        run: |
          python packaging/fetch_exiftool.py macos
          ./tools/macos/exiftool -ver

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build app with PyInstaller
        run: python -m PyInstaller fotofixer.spec --noconfirm

      # Linux: folder tarball plus AppImage
      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          # appimagetool is itself an AppImage; this avoids needing FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          "dist/FotoFixer/_internal/tools/linux/exiftool" -ver
          tar -C dist -czf dist/fotofixer-linux-x86_64.tar.gz "FotoFixer"
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" packaging/build_appimage.sh
          mkdir release-files
          mv dist/fotofixer-linux-x86_64.tar.gz dist/FotoFixer-x86_64.AppImage release-files/

      # Windows: the installer (packaging/windows_installer.iss) wraps the
      # one-folder app. Built with the runner's Inno Setup, or Chocolatey's
      # if the image stops shipping it.
      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "dist\FotoFixer\_internal\tools\windows\exiftool.exe" -ver
          New-Item -ItemType Directory release-files | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\dist\FotoFixer" `
            /Orelease-files packaging\windows_installer.iss
          Get-Item release-files\fotofixer-windows-x86_64-setup.exe

      # macOS: zipped .app bundle (ditto keeps the bundle's symlinks intact)
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          bundled_exiftool=$(find "dist/FotoFixer.app" -name exiftool -type f | head -n 1)
          "$bundled_exiftool" -ver
          mkdir release-files
          ditto -c -k --keepParent "dist/FotoFixer.app" \
            "release-files/fotofixer-macos-$(uname -m).zip"

      # Each file is uploaded as-is (archive: false), so a download from the
      # run's Artifacts section is the file itself, not a zip around it (the
      # macOS build is already a zip). archive: false takes one
      # file per upload, hence a step per file.
      - name: Upload build (Linux AppImage)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: release-files/FotoFixer-x86_64.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload build (Linux tarball)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: release-files/fotofixer-linux-x86_64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload build (Windows installer)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: release-files/fotofixer-windows-x86_64-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 30

      # macos-latest runs on Apple Silicon, so the zip is named ...-arm64.zip.
      - name: Upload build (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          path: release-files/fotofixer-macos-arm64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach builds to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # skip-decompress: the macOS build is a zip uploaded as-is (archive:
      # false above); without it the download unzips it and the check below
      # fails.
      - uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true
          skip-decompress: true

      # Stop before touching the release if any build file is missing.
      # These names are fixed: the in-app update check (core/updates.py)
      # finds each download by name, and tests/test_windows_installer.py
      # ties the two together.
      - name: Check all four build files are here
        run: |
          ls -l release-files
          for file in FotoFixer-x86_64.AppImage \
              fotofixer-linux-x86_64.tar.gz \
              fotofixer-windows-x86_64-setup.exe \
              fotofixer-macos-arm64.zip; do
            test -f "release-files/$file" || { echo "Missing: $file"; exit 1; }
          done

      - name: Upload builds to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" \
              --notes "Draft created by the build workflow. Add release notes before publishing."
          fi
          gh release upload "$GITHUB_REF_NAME" release-files/* --repo "$GITHUB_REPOSITORY" --clobber

      # The in-app update check verifies each download against the SHA-256
      # GitHub computes for it. Without digests there is no one-click
      # update, so stop here if any is missing (they appear shortly after
      # the upload, hence the retries).
      - name: Check every release file has a SHA-256 digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The by-tag endpoint hides drafts, so find the release in the list.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")
          for attempt in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/releases/$id" \
              --jq '.assets[] | "\(.name) \(.digest // "MISSING")"' | tee digests.txt
            grep -q MISSING digests.txt || break
            sleep 10
          done
          ! grep -q MISSING digests.txt
          test "$(wc -l < digests.txt)" -eq 4
