# FotoFixer – When & Where: nginx serving the static web app.
# Included inside nginx's http block by the nginx-unprivileged image
# (/etc/nginx/conf.d/*.conf). Listens on 8080 as an unprivileged user.

# Slows password guessing (and any flood): 5 requests per second per
# address, with room for a page load's burst of files.
limit_req_zone $binary_remote_addr zone=fotofixer:1m rate=5r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Written at start by docker/entrypoint/40-fotofixer-password.sh:
    # "auth_basic off;" or the password protection, and the access log setting.
    include /tmp/fotofixer/auth.conf;
    include /tmp/fotofixer/log.conf;

    limit_req zone=fotofixer burst=40 nodelay;

    # Security headers (see docs/ROADMAP.md, "Container and security").
    # The script-src allows WebAssembly; img-src allows map tiles from
    # OpenStreetMap, USGS, and Esri (the visitor's own key). No inline
    # scripts or styles anywhere in the app.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' data: blob: https://tile.openstreetmap.org https://basemap.nationalmap.gov https://ibasemaps-api.arcgis.com; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Every file is revalidated (ETag / Last-Modified), so an updated image
    # shows at once while the 24 MB of WebAssembly stays cached between
    # visits. Nothing is cached stale.
    add_header Cache-Control "no-cache" always;

    # Serve the pre-compressed .gz made at build time when the browser
    # accepts gzip; compress the small text files on the fly otherwise.
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    types {
        # Make sure .wasm has the type WebAssembly streaming needs, whatever
        # the base image's mime.types says; the rest of the table is kept.
        application/wasm wasm;
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        application/zip zip;
        application/octet-stream whl;
        image/svg+xml svg;
        image/png png;
        text/plain txt md;
    }

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
